services:
  - type: web
    name: demolition-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python scripts/seed_db.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./demolition_intelligence.db
      - key: DATABASE_SYNC_URL
        value: sqlite:///./demolition_intelligence.db
      - key: SECRET_KEY
        generateValue: true
